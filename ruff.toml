line-length = 100
target-version = "py311"

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501",  # line too long
    "B008",  # function call in default arg
]

[lint.isort]
known-first-party = ["app", "common", "contracts"]

[format]
quote-style = "double"
indent-style = "space"
