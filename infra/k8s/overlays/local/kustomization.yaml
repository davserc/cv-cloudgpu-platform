apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay LOCAL — kind cluster con Postgres en pod.
#
# Antes del primer deploy:
#   cp infra/k8s/overlays/local/secret.yaml.tpl infra/k8s/overlays/local/secret.yaml
#   kubectl apply -f infra/k8s/overlays/local/secret.yaml
#
# Deploy:
#   kubectl apply -k infra/k8s/overlays/local/

resources:
  # Base compartida (kafka, servicios de app, observabilidad)
  - ../..

  # Postgres en pod — solo en local (en cloud se usa Cloud SQL via Auth Proxy)
  - ../../services/postgres/pvc.yaml
  - ../../services/postgres/deployment.yaml
  - ../../services/postgres/service.yaml
