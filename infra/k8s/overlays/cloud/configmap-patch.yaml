apiVersion: v1
kind: ConfigMap
metadata:
  name: cv-platform-config
  namespace: cv-platform
data:
  # Obtener con: tofu output db_instance_connection_name
  # Formato: PROJECT_ID:REGION:INSTANCE_NAME
  CLOUD_SQL_INSTANCE: "CHANGE_ME_PROJECT:us-central1:cv-postgres"

  # Dominios del frontend en Firebase Hosting
  # Reemplazar PROYECTO con el ID del proyecto Firebase
  CORS_ALLOW_ORIGINS: "https://CHANGE_ME_PROYECTO.web.app,https://CHANGE_ME_PROYECTO.firebaseapp.com"
