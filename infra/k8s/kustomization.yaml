apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base compartida entre entornos. NO aplicar directamente.
# Usar los overlays según entorno:
#
#   Local (kind):
#     kubectl apply -f infra/k8s/overlays/local/secret.yaml   # 1 sola vez
#     kubectl apply -k infra/k8s/overlays/local/
#
#   Cloud (GKE):
#     kubectl apply -f infra/k8s/overlays/cloud/secret.yaml   # 1 sola vez
#     kubectl apply -k infra/k8s/overlays/cloud/

namespace: cv-platform

resources:
  # Namespace (must exist before other resources)
  - base/namespace.yaml

  # Non-secret shared configuration
  - base/configmap.yaml

  # Kubernetes ServiceAccount (WI annotation ignorada en local, activa en GKE)
  - base/serviceaccount.yaml

  # Infrastructure — Kafka + Zookeeper
  - services/kafka/zookeeper-deployment.yaml
  - services/kafka/zookeeper-service.yaml
  - services/kafka/kafka-deployment.yaml
  - services/kafka/kafka-service.yaml

  # Application — api-gateway (external entry point, LoadBalancer)
  - services/api-gateway/deployment.yaml
  - services/api-gateway/service.yaml

  # Application — model-registry + worker
  - services/model-registry/deployment.yaml
  - services/model-registry/worker-deployment.yaml
  - services/model-registry/service.yaml

  # Application — training-service + worker
  - services/training-service/artifacts-pvc.yaml
  - services/training-service/deployment.yaml
  - services/training-service/worker-deployment.yaml
  - services/training-service/service.yaml

  # Application — evaluation-service + worker
  - services/evaluation-service/deployment.yaml
  - services/evaluation-service/worker-deployment.yaml
  - services/evaluation-service/service.yaml

  # Application — model-serving
  - services/model-serving/deployment.yaml
  - services/model-serving/service.yaml

  # Observability — Prometheus + Grafana
  - observability/prometheus-rbac.yaml
  - observability/prometheus-configmap.yaml
  - observability/prometheus-deployment.yaml
  - observability/grafana-configmap.yaml
  - observability/grafana-deployment.yaml
