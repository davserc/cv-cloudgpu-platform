apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-worker
  namespace: cv-platform
  labels:
    app: training-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: training-worker
  template:
    metadata:
      labels:
        app: training-worker
    spec:
      containers:
        - name: training-worker
          image: training-service:local
          imagePullPolicy: Never
          args: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: cv-platform-config
            - secretRef:
                name: cv-platform-secrets
          env:
            - name: KAFKA_TOPIC
              value: "training-jobs"
            - name: KAFKA_OUTPUT_TOPIC
              value: "model-trained"
            - name: WORKER_MAX_CONCURRENCY
              value: "1"
            - name: TRAIN_LOG_DIR
              value: "/data/artifacts"
            - name: TRAIN_ARTIFACT_DST
              value: "/data/artifacts"
            - name: VAST_OFFER_BLACKLIST_TTL_SEC
              value: "86400"
            - name: VAST_BOOT_TIMEOUT_BLACKLIST_TTL_SEC
              value: "3600"
            - name: TRAIN_SSH_TIMEOUT_SEC
              value: "600"
            - name: VAST_OFFER_BLACKLIST_PATH
              value: "/data/artifacts/.vast_offer_blacklist.json"
            - name: VAST_PREFERRED_ZONES
              value: "US,CA,PL,DE,NL,GB,CZ,FR,ES,IT,JP,KR"
            - name: VAST_MIN_VRAM_GB
              value: "10"
            - name: VAST_KEEP_INSTANCE_ON_FAILURE
              value: "0"
            - name: DOCKERHUB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cv-platform-secrets
                  key: DOCKERHUB_USERNAME
                  optional: true
            - name: DOCKERHUB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cv-platform-secrets
                  key: DOCKERHUB_PASSWORD
                  optional: true
          volumeMounts:
            - name: ssh-key
              mountPath: /root/.ssh/id_ed25519_src
              subPath: id_ed25519
              readOnly: true
            - name: artifacts
              mountPath: /data/artifacts
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: ssh-key
          secret:
            secretName: cv-platform-secrets
            items:
              - key: VAST_SSH_PRIVATE_KEY
                path: id_ed25519
                mode: 0400
        - name: artifacts
          persistentVolumeClaim:
            claimName: artifacts-pvc
