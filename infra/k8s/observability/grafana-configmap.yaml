apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: cv-platform
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        isDefault: true
        access: proxy
        uid: prometheus
      - name: Loki
        type: loki
        url: http://loki:3100
        access: proxy
        uid: loki
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: cv-platform
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: cv-platform
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
