apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cv-platform
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.5.2
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cv-platform-secrets
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-training
              mountPath: /var/lib/grafana/dashboards/training-worker.json
              subPath: training-worker.json
            - name: dashboard-pods
              mountPath: /var/lib/grafana/dashboards/pod-metrics.json
              subPath: pod-metrics.json
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
        - name: tls-proxy
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: tls-nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-training
          configMap:
            name: grafana-dashboard-training
        - name: dashboard-pods
          configMap:
            name: grafana-dashboard-pods
        - name: tls-nginx-conf
          configMap:
            name: grafana-tls-nginx-conf
        - name: tls-certs
          secret:
            secretName: grafana-tls
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cv-platform
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - name: https
      port: 443
      targetPort: 8443
