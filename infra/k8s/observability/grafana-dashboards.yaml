apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-training
  namespace: cv-platform
  labels:
    grafana_dashboard: "1"
data:
  training-worker.json: |
    {
      "title": "Training Worker Logs",
      "uid": "training-worker-logs",
      "schemaVersion": 40,
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Training Worker Logs",
          "type": "logs",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": {
            "showTime": true,
            "sortOrder": "Descending",
            "enableLogDetails": true,
            "wrapLogMessage": true
          },
          "targets": [{
            "expr": "{container=\"training-worker\", namespace=\"cv-platform\"}",
            "refId": "A"
          }]
        },
        {
          "id": 2,
          "title": "API Gateway Logs",
          "type": "logs",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 12 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": {
            "showTime": true,
            "sortOrder": "Descending",
            "enableLogDetails": true,
            "prettifyLogMessage": true
          },
          "targets": [{
            "expr": "{container=\"api-gateway\", namespace=\"cv-platform\"}",
            "refId": "A"
          }]
        },
        {
          "id": 3,
          "title": "All Services Logs",
          "type": "logs",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 22 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": {
            "showTime": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [{
            "expr": "{namespace=\"cv-platform\"}",
            "refId": "A"
          }]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-pods
  namespace: cv-platform
  labels:
    grafana_dashboard: "1"
data:
  pod-metrics.json: |
    {
      "title": "Pod Metrics",
      "uid": "pod-metrics",
      "schemaVersion": 40,
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "CPU Usage por Pod",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"cv-platform\", container!=\"\", container!=\"POD\"}[2m])) by (pod)",
            "legendFormat": "{{pod}}",
            "refId": "A"
          }]
        },
        {
          "id": 2,
          "title": "Memory Usage por Pod (MB)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum(container_memory_working_set_bytes{namespace=\"cv-platform\", container!=\"\", container!=\"POD\"}) by (pod) / 1024 / 1024",
            "legendFormat": "{{pod}}",
            "refId": "A"
          }]
        },
        {
          "id": 3,
          "title": "API Gateway — Request Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "sum(rate(http_requests_total{namespace=\"cv-platform\"}[2m])) by (handler, method, status_code)",
            "legendFormat": "{{method}} {{handler}} {{status_code}}",
            "refId": "A"
          }]
        },
        {
          "id": 4,
          "title": "API Gateway — Latencia P95 (ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"cv-platform\"}[2m])) by (le, handler)) * 1000",
            "legendFormat": "{{handler}}",
            "refId": "A"
          }]
        }
      ]
    }
