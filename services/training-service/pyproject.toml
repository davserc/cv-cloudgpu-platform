[project]
name = "training-service"
version = "0.1.0"
description = "Training service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn[standard]", "kafka-python", "vast-gpu-automation"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.uvicorn]
app = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=60"\n