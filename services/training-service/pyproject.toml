[project]
name = "training-service"
version = "0.1.0"
description = "Training service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn[standard]", "kafka-python", "vast-gpu-automation"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.8"]

[tool.uvicorn]
app = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
omit = [
    "app/worker.py",
    "app/vast_runner.py",
    "app/gcs_utils.py",
    "app/notify.py",
    "app/db_ops.py",
    "app/main.py",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["app.schemas"]
disallow_untyped_defs = true
warn_return_any = true
