[project]
name = "api-gateway"
version = "0.1.0"
description = "API Gateway service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn[standard]", "httpx", "kafka-python", "python-multipart", "contracts", "prometheus-fastapi-instrumentator>=6.0", "google-cloud-storage"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx", "mypy>=1.8"]

[tool.uvicorn]
app = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=60"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["app.schemas", "app.security"]
disallow_untyped_defs = true
warn_return_any = true
