name: CI

on:
  push:
    branches: [main, tp4-cicd]
  pull_request:
    branches: [main, tp4-cicd]

permissions:
  contents: read
  packages: write   # needed for ghcr.io push on main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install ruff

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

  # ── api-gateway tests ────────────────────────────────────────────────────────
  test-api-gateway:
    name: Tests – api-gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install fastapi uvicorn sqlalchemy kafka-python python-dotenv \
                      httpx python-multipart pytest pytest-cov
          pip install -e .

      - run: pytest

  # ── training-service tests ───────────────────────────────────────────────────
  test-training-service:
    name: Tests – training-service
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout cv-cloudgpu-platform
        uses: actions/checkout@v4
        with:
          path: cv-cloudgpu-platform

      - name: Checkout cloudgpu-automation-lib
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/cloudgpu-automation-lib
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: cloudgpu-automation-lib

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install -e cloudgpu-automation-lib
          pip install fastapi uvicorn sqlalchemy kafka-python python-dotenv \
                      httpx pytest pytest-cov
          pip install -e cv-cloudgpu-platform/services/training-service

      - name: Run tests
        working-directory: cv-cloudgpu-platform/services/training-service
        run: pytest

  # ── model-registry tests ─────────────────────────────────────────────────────
  test-model-registry:
    name: Tests – model-registry
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/model-registry
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install fastapi uvicorn sqlalchemy kafka-python python-dotenv \
                      httpx pytest pytest-cov
          pip install -e .

      - run: pytest

  # ── Kafka integration tests ───────────────────────────────────────────────────
  test-integration:
    name: Tests – kafka integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install pytest kafka-python fastapi httpx sqlalchemy

      - run: pytest tests/

  # ── Type-check ──────────────────────────────────────────────────────────────
  typecheck:
    name: Type-check – ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, model-registry, evaluation-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps + mypy
        run: |
          pip install fastapi uvicorn[standard] sqlalchemy kafka-python python-dotenv \
                      httpx python-multipart pydantic mypy
          pip install -e .

      - name: Run mypy
        run: mypy app/

  typecheck-training-service:
    name: Type-check – training-service
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout cv-cloudgpu-platform
        uses: actions/checkout@v4
        with:
          path: cv-cloudgpu-platform

      - name: Checkout cloudgpu-automation-lib
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/cloudgpu-automation-lib
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: cloudgpu-automation-lib

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps + mypy
        run: |
          pip install -e cloudgpu-automation-lib
          pip install fastapi uvicorn[standard] sqlalchemy kafka-python python-dotenv \
                      httpx pydantic mypy
          pip install -e cv-cloudgpu-platform/services/training-service

      - name: Run mypy
        working-directory: cv-cloudgpu-platform/services/training-service
        run: mypy app/

  # ── Build Docker images ──────────────────────────────────────────────────────
  build:
    name: Build – ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [lint, test-api-gateway, test-training-service, test-model-registry, test-integration]
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, model-registry, evaluation-service, model-serving]

    steps:
      - name: Checkout cv-cloudgpu-platform
        uses: actions/checkout@v4
        with:
          path: cv-cloudgpu-platform

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: cv-cloudgpu-platform
          file: cv-cloudgpu-platform/services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to GKE (cloud overlay) ───────────────────────────────────────────
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: [build, build-training-service]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write   # requerido para Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/647757978174/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "cv-cicd@project-38c56a6f-24a9-45fb-aef.iam.gserviceaccount.com"

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: cv-platform
          location: us-central1-a
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Bootstrap namespace and secret
        run: |
          kubectl create namespace cv-platform --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic cv-platform-secrets \
            --namespace cv-platform \
            --from-literal=DATABASE_URL="postgresql+psycopg2://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@127.0.0.1:5432/${{ secrets.DB_NAME }}" \
            --from-literal=API_GATEWAY_API_KEY="${{ secrets.API_GATEWAY_API_KEY }}" \
            --from-literal=GRAFANA_ADMIN_PASSWORD="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --from-literal=VAST_SSH_PRIVATE_KEY="${{ secrets.VAST_SSH_PRIVATE_KEY }}" \
            --from-literal=VAST_SSH_PUBLIC_KEY="${{ secrets.VAST_SSH_PUBLIC_KEY }}" \
            --from-literal=VASTAI_API_KEY="${{ secrets.VASTAI_API_KEY }}" \
            --from-literal=DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" \
            --from-literal=DOCKERHUB_PASSWORD="${{ secrets.DOCKERHUB_PASSWORD }}" \
            --from-literal=GCP_SA_B64="${{ secrets.GCP_SA_B64 }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy cloud overlay
        run: kubectl apply -k infra/overlays/cloud/

  # training-service needs cloudgpu-automation-lib in build context
  build-training-service:
    name: Build – training-service
    runs-on: ubuntu-latest
    needs: [lint, test-training-service]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout cv-cloudgpu-platform
        uses: actions/checkout@v4
        with:
          path: cv-cloudgpu-platform

      - name: Checkout cloudgpu-automation-lib
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/cloudgpu-automation-lib
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: cloudgpu-automation-lib

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: cv-cloudgpu-platform/services/training-service/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/training-service:latest
            ghcr.io/${{ github.repository_owner }}/training-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
